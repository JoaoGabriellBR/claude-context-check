<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
  </defs>

  <style>
    .code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; fill: #c9d1d9; }
    .prompt { fill: #58a6ff; font-weight: 600; }
    .cmd { fill: #f0f6fc; font-weight: bold; }
    .title { fill: #f0f6fc; font-weight: bold; font-size: 14px; }
    .dim { fill: #484f58; }
    .subtext { fill: #8b949e; }
    .badge-alto { fill: #ff7b72; font-weight: bold; }
    .badge-medio { fill: #d29922; font-weight: bold; }
    .score-label { fill: #f0f6fc; font-weight: bold; font-size: 15px; }
    .score-bad { fill: #ff7b72; font-weight: bold; font-size: 16px; }
    .cursor { fill: #58a6ff; animation: blink 1s infinite; }
  </style>

  <!-- Window container with shadow -->
  <g filter="url(#shadow)">
    <!-- Terminal Background -->
    <rect x="20" y="20" width="840" height="440" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1" />

    <!-- Terminal Header Bar -->
    <path d="M 20 30 Q 20 20 30 20 L 850 20 Q 860 20 860 30 L 860 58 L 20 58 Z" fill="url(#headerGrad)" stroke="#30363d" stroke-width="1" />

    <!-- Window Controls -->
    <circle cx="44" cy="39" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
    <circle cx="64" cy="39" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
    <circle cx="84" cy="39" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

    <!-- Window Title -->
    <text x="440" y="43" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">chc scan examples/sample-repo — bash — 80x24</text>
  </g>

  <!-- Terminal Content -->
  <g transform="translate(45, 95)" class="code">
    <!-- Command Line -->
    <text x="0" y="0">
      <tspan class="prompt">$ </tspan>
      <tspan class="cmd">chc scan examples/sample-repo</tspan>
    </text>

    <!-- Scan Header -->
    <text x="0" y="32" class="title">Context Health Check — examples/sample-repo</text>
    <text x="0" y="48" class="dim">────────────────────────────────────────────────────────────────────────</text>

    <!-- Findings -->
    <!-- ALTO -->
    <g transform="translate(0, 72)">
      <rect x="0" y="-12" width="60" height="18" rx="3" fill="#3c1e22" stroke="#ff7b72" stroke-width="0.8" />
      <text x="30" y="1" text-anchor="middle" class="badge-alto" font-size="11">ALTO</text>
      <text x="70" y="1" fill="#f0f6fc">2 instrucao(oes) duplicada(s) encontrada(s) no CLAUDE.md:</text>
      <text x="70" y="18" class="subtext">- "sempre rode os testes antes de fazer commit para garantir que..."</text>
      <text x="70" y="34" class="subtext">- "use conventional commits para todas as mensagens de commit deste..."</text>
    </g>

    <!-- MEDIO 1 -->
    <g transform="translate(0, 130)">
      <rect x="0" y="-12" width="60" height="18" rx="3" fill="#372d16" stroke="#d29922" stroke-width="0.8" />
      <text x="30" y="1" text-anchor="middle" class="badge-medio" font-size="11">MEDIO</text>
      <text x="70" y="1" fill="#f0f6fc">Skill essencial ausente: "security-review" (injection, authz, segredos vazados).</text>
    </g>

    <!-- MEDIO 2 -->
    <g transform="translate(0, 160)">
      <rect x="0" y="-12" width="60" height="18" rx="3" fill="#372d16" stroke="#d29922" stroke-width="0.8" />
      <text x="30" y="1" text-anchor="middle" class="badge-medio" font-size="11">MEDIO</text>
      <text x="70" y="1" fill="#f0f6fc">Skill essencial ausente: "testes" (guia de testes reproduzivel para QA).</text>
    </g>

    <!-- MEDIO 3 -->
    <g transform="translate(0, 190)">
      <rect x="0" y="-12" width="60" height="18" rx="3" fill="#372d16" stroke="#d29922" stroke-width="0.8" />
      <text x="30" y="1" text-anchor="middle" class="badge-medio" font-size="11">MEDIO</text>
      <text x="70" y="1" fill="#f0f6fc">O handoff mais recente (2026-04-12) tem 171 dias (limiar: 30 dias).</text>
    </g>

    <!-- Footer separator -->
    <text x="0" y="228" class="dim">────────────────────────────────────────────────────────────────────────</text>

    <!-- Score -->
    <text x="0" y="254">
      <tspan class="score-label">Score: </tspan>
      <tspan class="score-bad">44/100</tspan>
      <tspan class="subtext">  (Falha em pipeline com --fail-under 70)</tspan>
    </text>

    <!-- Next prompt -->
    <text x="0" y="292">
      <tspan class="prompt">$ </tspan>
      <tspan fill="#8b949e">chc scan examples/clean-repo</tspan>
      <tspan fill="#3fb950" font-weight="bold">  # Score: 100/100 ✓</tspan>
    </text>
  </g>
</svg>
